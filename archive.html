<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta property="og:title" content="Archive · Art for rich people.">
<meta property="og:description" content="Every piece sold. No buyer names. No prices. Tombstones.">
<meta property="og:url" content="https://artforrichpeople.com/archive.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://artforrichpeople.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>ARCHIVE · ART FOR RICH PEOPLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0A0908;
  --fg: #EAE0D5;
  --dim: #6B635A;
  --line: #2a2825;
  --accent: #C1121F;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  line-height: 1.4;
  min-height: 100vh;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent); color: var(--fg); }

nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.5rem 2.5rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg);
}
nav a { color: inherit; text-decoration: none; }
nav .logo { font-size: 0.75rem; letter-spacing: 0.2em; }
nav .label { font-size: 0.7rem; letter-spacing: 0.15em; opacity: 0.7; }

main {
  flex: 1;
  padding: 6rem 2.5rem 9rem;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}

main h1 {
  font-size: clamp(4rem, 12vw, 11rem);
  font-weight: 500;
  font-style: italic;
  line-height: 0.9;
  letter-spacing: -0.04em;
  margin-bottom: 2.5rem;
}

.empty {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  letter-spacing: 0.25em;
  color: var(--dim);
  text-transform: uppercase;
  padding: 2rem 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.tombstones {
  list-style: none;
  margin-top: 2rem;
}
.tombstones li {
  display: grid;
  grid-template-columns: 80px 1fr 80px 100px;
  gap: 2rem;
  padding: 2rem 0;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  align-items: center;
}
.tombstones li:last-child { border-bottom: 1px solid var(--line); }
.tombstones .piece-no { color: var(--dim); }
.tombstones .title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.4rem;
  letter-spacing: 0;
  text-transform: none;
}
.tombstones .year { color: var(--dim); }
.tombstones .status { color: var(--dim); text-align: right; }

footer {
  border-top: 1px solid var(--line);
  padding: 2.5rem;
  display: flex; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--dim);
  flex-wrap: wrap;
  gap: 1rem;
}
footer a { color: inherit; text-decoration: none; transition: color 0.3s; }
footer a:hover { color: var(--fg); }

@media (max-width: 800px) {
  main { padding: 4rem 1.5rem 6rem; }
  nav { padding: 1rem 1.5rem; }
  footer { padding: 2rem 1.5rem; }
  .tombstones li { grid-template-columns: 60px 1fr 60px; }
  .tombstones .status { display: none; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">A · F · R · P</a>
  <div class="label">ARCHIVE</div>
</nav>

<main>
  <h1>Archive.</h1>
  <p class="empty">Empty. Soon.</p>

  <!--
    When pieces sell, replace the .empty paragraph with the tombstones list:

    <ol class="tombstones">
      <li>
        <span class="piece-no">001</span>
        <span class="title">Untitled.</span>
        <span class="year">2026</span>
        <span class="status">SOLD</span>
      </li>
    </ol>

    No buyer names. No prices. Just tombstones. Each entry final.
  -->
</main>

<footer>
  <div>© ARTFORRICHPEOPLE · 2026</div>
  <a href="/">RETURN</a>
  <div>WE'LL CALL YOU. DON'T CALL US.</div>
</footer>

</body>
</html>
